on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/semgrep.yml
  schedule:
    # random HH:MM to avoid a load spike on GitHub Actions at 00:00
    - cron: 54 19 * * *

name: Semgrep

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEMGREP_APP_TOKEN: [redacted]
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Cache semgrep rules
        uses: actions/cache@v4
        with:
          path: ~/.cache/semgrep
          key: ${{ runner.os }}-semgrep-rules-${{ hashFiles('.github/workflows/semgrep.yml') }}
          restore-keys: |
            ${{ runner.os }}-semgrep-rules-

      - run: semgrep ci